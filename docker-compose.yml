# PostgreSQL 18 lab for "Busy listing". pg_stat_statements is preloaded: it is the evidence source.
# track_utility is off so BEGIN and COMMIT do not crowd the "top by calls" ranking.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${PGUSER:-lab}
      POSTGRES_PASSWORD: ${PGPASSWORD:-lab}
      POSTGRES_DB: ${PGDATABASE:-lab}
    ports:
      - "${PGPORT:-55432}:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track_utility=off
      - -c
      - pg_stat_statements.max=5000
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - shared_buffers=512MB
    shm_size: 1gb
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-lab} -d ${PGDATABASE:-lab}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
