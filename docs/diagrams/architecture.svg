<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="t d">
<title id="t">Busy listing: architecture</title>
<desc id="d">A runner replays four phases. A load script calls the listing page, a FastAPI service inside uvicorn. The page calls an ORM, which sends statements to the orders and customers tables in PostgreSQL 18. Query statistics from pg_stat_statements count every statement. The runner resets and ranks the statistics, runs EXPLAIN and the migrations. An amber failure path marks the naive N+1 loop.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="819" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="818" rx="16"/>
<text class="title" x="48" y="68">Rank the queries, then fix the top two</text>
<text class="caption" x="48" y="100">The runner replays four phases; pg_stat_statements ranks what ran. Amber: the two problems the lesson fixes.</text>
<rect class="svc" x="48" y="192" width="216" height="116" rx="12"/>
<text class="name" x="64" y="224">Load script</text>
<text class="sub" x="64" y="248">HttpLoadDriver</text>
<text class="sub" x="64" y="270">300 requests,</text>
<text class="sub" x="64" y="292">fixed seed</text>
<rect class="boundary" x="392" y="132" width="324" height="360" rx="14"/>
<text class="tag" x="408" y="160">Listing service (uvicorn)</text>
<rect class="svc" x="416" y="184" width="276" height="108" rx="12"/>
<text class="name" x="432" y="216">Listing page</text>
<text class="sub" x="432" y="240">GET /orders, GET /health</text>
<text class="sub" x="432" y="262">strategy default: keyset</text>
<rect class="svc" x="416" y="336" width="276" height="108" rx="12"/>
<text class="name" x="432" y="368">ORM</text>
<text class="sub" x="432" y="392">SQLAlchemy 2.0, psycopg 3</text>
<text class="sub" x="432" y="414">naive, batched, keyset</text>
<rect class="boundary" x="828" y="290" width="324" height="430" rx="14"/>
<text class="tag" x="844" y="318">PostgreSQL 18</text>
<path class="store" d="M852 358a138 12 0 0 1 276 0v102a138 12 0 0 1 -276 0z"/>
<path class="rim" d="M852 358a138 12 0 0 0 276 0"/>
<text class="name" x="990" y="386" text-anchor="middle">Orders and customers</text>
<text class="sub" x="990" y="408" text-anchor="middle">orders: 1,000,000 rows</text>
<text class="sub" x="990" y="430" text-anchor="middle">customers: 100,000</text>
<path class="store" d="M852 578a138 12 0 0 1 276 0v102a138 12 0 0 1 -276 0z"/>
<path class="rim" d="M852 578a138 12 0 0 0 276 0"/>
<text class="name" x="990" y="606" text-anchor="middle">Query statistics</text>
<text class="sub" x="990" y="628" text-anchor="middle">pg_stat_statements</text>
<text class="sub" x="990" y="650" text-anchor="middle">reset before each phase</text>
<rect class="note" x="392" y="508" width="324" height="100" rx="10"/>
<text class="label b t-warn" x="408" y="536">N+1: 6,000 customer lookups</text>
<text class="sub" x="408" y="560">page 10,000 with OFFSET:</text>
<text class="sub" x="408" y="582">200,751 pages touched</text>
<text class="sub" x="408" y="604">(make run, phase 1 naive)</text>
<rect class="svc" x="48" y="620" width="216" height="116" rx="12"/>
<text class="name" x="64" y="652">Runner</text>
<text class="sub" x="64" y="676">busy-listing-run</text>
<text class="sub" x="64" y="698">ReplayLesson</text>
<text class="sub" x="64" y="720">writes sql/explain/</text>
<path class="sync" d="M264 240H416"/>
<text class="label t-accent" x="272" y="228">GET /orders</text>
<path class="sync" d="M554 292V336"/>
<text class="label t-accent" x="566" y="320">ListOrders</text>
<path class="sync" d="M692 372H852"/>
<text class="label t-accent" x="728" y="360">statements</text>
<path class="fail" d="M692 412H852"/>
<text class="label t-warn" x="728" y="432">naive N+1</text>
<path class="sync" d="M156 620V308"/>
<text class="label t-accent" x="168" y="470">run(strategy)</text>
<path class="sync" d="M264 638H788Q800 638 800 626V464Q800 452 812 452H852"/>
<text class="label t-accent" x="272" y="626">EXPLAIN, migrations</text>
<path class="sync" d="M264 664H852"/>
<text class="label t-accent" x="272" y="688">reset, rank</text>
<path class="sync" d="M48 776H112"/><text class="legend" x="124" y="781">sync call</text>
<path class="fail" d="M696 776H760"/><text class="legend" x="772" y="781">failure path</text>
</svg>
